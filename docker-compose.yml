version: '3.8'

services:
  # ÉTAGE 1 : BDD (PostgreSQL)
  db:
    image: postgres:15
    container_name: pixmatcher_db
    restart: always
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      backend_network:
        aliases:
          - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ÉTAGE 2 : Le Backend (FastAPI + IA)
  backend:
    build: ./backend
    container_name: pixmatcher_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      model: 
        condition: service_healthy
    volumes:
      - ./ressources:/app/ressources
    expose:
      - "8000"
    networks:
      - backend_network
      - frontend_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
# ÉTAGE 2.5 : Le moteur d'IA 
  model:
    build: ./model
    container_name: pixmatcher_model
    restart: always
    expose:
      - "8001"
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/docs || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
  # ÉTAGE 3 : Le Frontend (Streamlit)
  frontend:
    build: ./frontend
    container_name: pixmatcher_frontend
    restart: always
    expose:
      - "8501"
    depends_on:
      backend:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./ressources:/app/ressources
    networks:
      - frontend_network
      - nginx_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ÉTAGE 4 : pgAdmin (Interface web PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4
    container_name: pixmatcher_pgadmin
    restart: always
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend_network

  # ÉTAGE 5 : Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: pixmatcher_nginx
    restart: always
    ports:
      - "8080:80"
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - nginx_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  backend_network:
  frontend_network:
  nginx_network:
